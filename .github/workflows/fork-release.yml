# Fork-only: builds brenc/zrepl releases for Ansible to install.
# Tag main as vX.Y.Z-brenc.N (e.g. v0.7.0-brenc.1) and push the tag.
name: fork-release

on:
  push:
    tags: ["v*-brenc.*"]

permissions:
  contents: write # create the release
  id-token: write # sign build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest stable Go with every stdlib security patch. go.mod's
          # `go 1.26.0` would pin exactly 1.26.0.
          go-version: stable
          check-latest: true

      # setup-uv's version-file only understands pyproject.toml and the like,
      # not upstream's bare .uv-version.
      - run: echo "UV_VERSION=$(cat .uv-version)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Check tag
        run: |
          # The version stamped into binaries and the deb comes from git
          # describe, which ignores lightweight tags.
          described=$(git describe --always --dirty)
          if [ "$described" != "$GITHUB_REF_NAME" ]; then
            echo "::error::git describe gives $described, not $GITHUB_REF_NAME; push an annotated tag (git tag -a)"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Check
        run: |
          make vet
          make test-go
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build
        run: |
          make noarch
          make zrepl-bin GOOS=linux GOARCH=amd64
          make zrepl-bin GOOS=linux GOARCH=arm64
          make zrepl-bin GOOS=freebsd GOARCH=amd64
          make deb-docker GOOS=linux GOARCH=amd64
          git clean -fdq packaging/deb/debian

      - name: Assemble
        run: |
          mkdir dist-release
          cp artifacts/zrepl_*_amd64.deb dist-release/
          for t in linux-amd64 linux-arm64 freebsd-amd64; do
            tar -C artifacts -czf "dist-release/zrepl-$t.tar.gz" \
              --transform "s#zrepl-$t#zrepl#" "zrepl-$t"
          done
          cd dist-release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
